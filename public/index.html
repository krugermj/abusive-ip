<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Abusive IP</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #141416;
      --text: #f5f5f6;
      --muted: #a7a7b0;
      --accent: #ff3b3b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(255, 40, 40, 0.18), transparent 60%),
        var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    main {
      text-align: center;
      padding: 2.5rem 1.5rem 3rem;
      max-width: 28rem;
    }
    .mark {
      width: 96px;
      height: 96px;
      margin: 0 auto;
      border-radius: 22px;
      background: #2a2a2e;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      display: grid;
      place-items: center;
    }
    .mark span {
      width: 54px;
      height: 62px;
      background: #ff2a2a;
      clip-path: polygon(50% 0, 100% 18%, 88% 78%, 50% 100%, 12% 78%, 0 18%);
      display: grid;
      place-items: center;
      color: #1a1a1a;
      font-weight: 800;
      font-size: 1.6rem;
    }
    h1 {
      margin: 1.4rem 0 0.75rem;
      font-size: 2.25rem;
      font-weight: 650;
      letter-spacing: -0.03em;
    }
    .soon {
      margin: 0;
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    .note {
      margin: 1rem 0 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"><span>!</span></div>
    <h1>Abusive IP</h1>
    <p class="soon">Coming soon</p>
    <p class="note">This site is not available yet.</p>
  </main>
</body>
</html>
